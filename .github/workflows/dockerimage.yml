
name: "Build and push release docker image"

on:
  workflow_dispatch:
  push:
    branches:
      - harden
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:

  # Build non-root container image variant
  docker-nonroot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git describe
        id: image-tag
        run: |
          DESCRIBE_TAG="$(git describe --tags --always --dirty)"
          echo "tag=${DESCRIBE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Python for wheel pre-download
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prefetch wheels
        run: |
          mkdir -p vendor
          pip download \
            --only-binary=:all: \
            --platform manylinux_2_28_x86_64 \
            --python-version 3.13 \
            --implementation cp \
            --require-hashes \
            -r requirements.lock \
            -d vendor/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN  }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta-nonroot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # no "latest" tag for non-root variant
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.tag }}
            # set latest-nonroot tag for default branch
            type=raw,value=latest-nonroot

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          file: deploy/repo.nonroot.Dockerfile
          push: true
          network: none
          tags: ${{ steps.meta-nonroot.outputs.tags }}
          labels: ${{ steps.meta-nonroot.outputs.labels }}
